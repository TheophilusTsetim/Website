<!DOCTYPE html>
<html>
<head>
    <title>Product Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="product-card">
        <img
            src="images/images.jpg"
            alt="Smartphone"
            class="product-image"
        >
        <h1>Iphone 18 Promax </h1> 
        <p class="description">`
            A powerful I phone 18 promax with a beautiful
            display, excellent camera and long-lasting battery.
        </p>
        <p class="price">
            $2000
        </p>
        <p class="rating">
            ⭐⭐⭐⭐⭐ 4.8/5
        </p>
        <button class="buy-button">
            Buy Now
        </button>
    </div>
</body>
</html>
